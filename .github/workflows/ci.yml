name: Diario del Voto CI — Integridad y Construcción

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verificación, Linting y Pruebas Parlamentarias
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📦 Instalar Dependencias
        run: pnpm install --frozen-lockfile

      - name: 🔍 Linter Rápido de Código (Oxlint)
        run: pnpm lint

      - name: 🏗️ Compilación TypeScript y Empaquetado Vite
        run: pnpm build

      - name: 🏛️ Batería de Integridad Constitucional y Base de Datos SQLite
        run: python3 scripts/test_integrity.py
